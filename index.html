<!doctype html>
<html lang="fr">
    <head>
        <meta charset="UTF-8">
        <meta content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0"
              name="viewport">
        <meta content="ie=edge" http-equiv="X-UA-Compatible">
        <script crossorigin="anonymous" src="https://kit.fontawesome.com/0f5c6ee466.js"></script>
        <link href="css/style.css" rel="stylesheet">
        <title>OhMyFood - page principale</title>
    </head>
    <body>
        <header>
            <div class="header">
                <img alt="Logo princpale de PhMyFood" class="header__logo" src="images/logo/ohmyfood.png"/>
            </div>
            <div class="header__ville">
                <i class="fa-solid fa-location-dot header__ville--icon"></i>
                <p>Paris, Belleville</p>
            </div>
        </header>
        <main>
            <div class="menu">
                <h1 class="menu__title">Réserver le menu qui vous convient</h1>
                <p class="menu__description">Découvrez des restaurants d’exception, sélectionnés par nos soins.</p>
                <button class="menu__button btn-round">Explorer nos restaurants</button>
            </div>
            <section class="fonctionnement">
                <h2 class="fonctionnement__title">Fonctionnement</h2>
                <div class="fonctionnement__btn">
                    <button class="fonctionnement__btn__fonctionnement btn-round">
                        <p class="fonctionnement__btn__fonctionnement--number">1</p>
                        <i class="fa-solid fa-mobile-screen"></i>
                        <p>Choississez un restaurant</p>
                    </button>
                    <button class="fonctionnement__btn__fonctionnement btn-round">
                        <p class="fonctionnement__btn__fonctionnement--number">2</p>
                        <i class="fa-solid fa-list-ul"></i>
                        <p>Composer votre menu</p>
                    </button>
                    <button class="fonctionnement__btn__fonctionnement btn-round">
                        <p class="fonctionnement__btn__fonctionnement--number">3</p>
                        <i class="fa-solid fa-store fonctionnement__btn__fonctionnement--icone"></i>
                        <p>Deguster au restaurant</p>
                    </button>
                </div>
            </section>
        </main>
    </body>
</html>
