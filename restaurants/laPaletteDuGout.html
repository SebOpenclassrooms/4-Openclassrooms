<!doctype html>
<html lang="fr">
    <head>
        <meta charset="UTF-8">
        <meta content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0"
              name="viewport">
        <meta content="ie=edge" http-equiv="X-UA-Compatible">
        <script crossorigin="anonymous" src="https://kit.fontawesome.com/0f5c6ee466.js"></script>
        <link href="https://fonts.googleapis.com" rel="preconnect">
        <link crossorigin href="https://fonts.gstatic.com" rel="preconnect">
        <link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&family=Manrope:wght@200..800&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
              rel="stylesheet">
        <link href="https://fonts.googleapis.com" rel="preconnect">
        <link crossorigin href="https://fonts.gstatic.com" rel="preconnect">
        <link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&family=Manrope:wght@200..800&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Roboto:ital,wght@0,100..900;1,100..900&family=Shrikhand&display=swap"
              rel="stylesheet">
        <link href="../css/style.css" rel="stylesheet">
        <title>OhMyFood - restauraznt - La Palette du Gout</title>
    </head>
    <body>
        <header>
            <div class="header">
                <div class="header__btnRetour"><a href="../index.html"><i class="fa-solid fa-arrow-left"></i></a></div>
                <img alt="Logo princpale de PhMyFood" class="header__logo" src="../images/logo/ohmyfood.png"/>
            </div>
        </header>
        <main>
            <section class="container">
                <div class="container__image">
                    <img alt="La Palette du Gout" src="../images/restaurants/jay-wennington-N_Y88TWmGwA-unsplash.jpg">
                </div>
            </section>
            <section class="container__type">
                <article class="container__type__titre">
                    <h1 class="container__type__titre__menu">La palette du gout</h1>
                    <div class="container__type__titre__like">
                        <div class="heart-container">
                            <i class="fa-regular fa-heart heart-empty"></i>
                            <i class="fa-solid fa-heart heart-full"></i>
                        </div>
                    </div>
                </article>
                <article class="container__type__menu">
                    <div class="container__type__menu__titre">
                        <div class="container__type__menu__titre--titre">ENTRÉES</div>
                        <div class="container__type__menu__titre--ligne"></div>
                    </div>
                    <div class="container__type__menu__details btn-round">
                        <div class="container__type__menu__details__recette">
                            <div class="container__type__menu__details__recette--titre">Lorem ipsum dolor sit.</div>
                            <div class="container__type__menu__details__recette--detailRecette">Lorem ipsum dolor. Lorem ipsum dolor sit.
                            </div>
                        </div>
                        <div class="container__type__menu__details__recette--prix">
                            <div class="container__type__menu__details__recette--prix--valeur">40€</div>
                            <div class="container__type__menu__details__recette--prix--hover"><i class="fa-solid fa-circle-check container__type__menu__details__recette--prix--hover--icone"></i></div>
                        </div>
                    </div>
                </article>
                <button class="menu__button menu__button__commander btn-round margin-auto">Commander</button>
            </section>
        </main>
        <footer>
            <section class="footer__section">
                <div class="footer__section__img"><img alt="" src="../images/logo/ohmyfood@2x.svg" style="fill:white">
                </div>
                <div class="footer__section__texte">
                    <p>proposer un restaurant</p>
                    <p>Devenir partenaire</p>
                    <p>Mentions legals</p>
                    <p>contact</p>
                </div>
            </section>
        </footer>
    </body>
</html>
